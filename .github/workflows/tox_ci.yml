name: Continious Integration
on: pull_request
jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run black
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: install black
        run: pip install "black==26.5.1"
      - name: run black
        run: black --check pymzml
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: install tox
        run: pip install tox
      - name: Tox
        run: tox -e py
